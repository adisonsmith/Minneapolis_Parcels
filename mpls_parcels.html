<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title> MPLS Parcels - GIS 5574</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.24/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.24/"></script>
  <style>
    html,
    body,
    #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }

    #buttonContainer {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #506E50;
      color: #506E50;
    }
  </style>
</head>

<body>
  <div id="viewDiv"></div>
  <!--A container the button-->
  <div id="buttonContainer">
    <button id="clickButton">Satellite</button>
  </div>

  <script>
    require(["esri/views/MapView", "esri/WebMap"], (MapView, WebMap) => {
      const webmap = new WebMap({
        portalItem: {
          id: "ff11c7c75a6341a98cd997f216ec3fcd"
        }
      });

      const view = new MapView({
        map: webmap,
        container: "viewDiv"
      });

      // Button toggles between the original basemap and satellite
      let original;
      webmap.when(() => { original = webmap.basemap; });

      document.getElementById("clickButton").addEventListener("click", () => {
        webmap.basemap = (webmap.basemap === original) ? "satellite" : original;
      });
    });
  </script>
</body>

</html>
